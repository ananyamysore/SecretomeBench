name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[test,dev]'
      - run: ruff check src tests examples benchmarks
      - run: python -m pytest
      - run: python examples/generate_synthetic.py
      - run: secretomebench validate examples/synthetic_evidence.json
      - run: secretomebench analyze examples/synthetic_evidence.json --out /tmp/secretomebench-analysis
      - run: secretomebench run configs/analysis.json
      - run: secretomebench synthetic --out /tmp/secretomebench-example
      - run: secretomebench schema --out /tmp/secretomebench-schema.json
